<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Farmácia Alegria - Acessar Sistema</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a472a 0%, #0d2818 100%);
            font-family: 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Fundo com ícones e elementos de farmácia */
        body::before {
            content: "💊";
            position: absolute;
            font-size: 300px;
            opacity: 0.06;
            bottom: -80px;
            left: -80px;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }

        body::after {
            content: "⚕️";
            position: absolute;
            font-size: 280px;
            opacity: 0.06;
            top: -100px;
            right: -80px;
            pointer-events: none;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Elementos decorativos */
        .pharma-bg-icon-1 {
            position: absolute;
            top: 20%;
            left: 5%;
            font-size: 60px;
            opacity: 0.08;
            animation: spin 20s linear infinite;
        }

        .pharma-bg-icon-2 {
            position: absolute;
            bottom: 15%;
            right: 8%;
            font-size: 80px;
            opacity: 0.08;
            animation: pulse 4s ease-in-out infinite;
        }

        .pharma-bg-icon-3 {
            position: absolute;
            top: 50%;
            left: 15%;
            font-size: 45px;
            opacity: 0.06;
            animation: bounce 6s ease-in-out infinite;
        }

        .pharma-bg-icon-4 {
            position: absolute;
            bottom: 30%;
            right: 20%;
            font-size: 55px;
            opacity: 0.07;
            animation: float 7s ease-in-out infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Card de Seleção */
        .selection-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(0px);
            border-radius: 40px;
            padding: 2.5rem 2rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
            animation: fadeInScale 0.6s ease-out;
            position: relative;
            z-index: 10;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Logo e ícone */
        .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.2rem;
            box-shadow: 0 15px 25px rgba(46, 125, 50, 0.35);
            animation: logoGlow 2.5s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { 
                box-shadow: 0 15px 25px rgba(46, 125, 50, 0.35);
            }
            50% { 
                box-shadow: 0 20px 35px rgba(46, 125, 50, 0.55);
            }
        }

        .logo-icon i {
            font-size: 52px;
            color: white;
        }

        .logo-area h1 {
            color: #1b5e20;
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .logo-area p {
            color: #666;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .badge-pharma {
            background: #e8f5e9;
            border: 1px solid #4caf50;
            border-radius: 50px;
            padding: 5px 15px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: #2e7d32;
            margin-top: 0.8rem;
        }

        /* Opções de perfil */
        .perfil-options {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .perfil-option {
            background: #f8fafc;
            border: 2px solid #e8ecef;
            border-radius: 28px;
            padding: 1.2rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .perfil-option:hover {
            transform: translateX(8px);
            border-color: #2e7d32;
            background: linear-gradient(135deg, #ffffff, #f1f8e9);
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.15);
        }

        .perfil-option.selected {
            border-color: #2e7d32;
            background: linear-gradient(135deg, #e8f5e9, #ffffff);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
        }

        .option-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .perfil-option:hover .option-icon {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);
        }

        .option-icon i {
            font-size: 28px;
            color: white;
        }

        .option-info {
            flex: 1;
        }

        .option-info h3 {
            margin: 0 0 4px 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a2c3e;
        }

        .option-info p {
            margin: 0;
            font-size: 0.75rem;
            color: #8a9aa8;
        }

        .option-arrow {
            color: #2e7d32;
            font-size: 1.2rem;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .perfil-option:hover .option-arrow {
            opacity: 1;
            transform: translateX(5px);
        }

        .perfil-option.selected .option-arrow {
            opacity: 1;
        }

        /* Botão de prosseguir */
        .btn-proceed {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            border: none;
            border-radius: 18px;
            padding: 14px;
            font-weight: 600;
            color: white;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-proceed:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.4);
        }

        .btn-proceed:active {
            transform: translateY(0);
        }

        .btn-proceed:disabled {
            background: #bdbdbd;
            transform: none;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Divisor */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #bdbdbd;
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .divider::before {
            margin-right: 1rem;
        }

        .divider::after {
            margin-left: 1rem;
        }

        /* Links inferiores */
        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .footer-link {
            color: #8a9aa8;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-link:hover {
            color: #2e7d32;
        }

        /* Loading spinner */
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        /* Responsividade */
        @media (max-width: 480px) {
            .selection-card {
                padding: 1.8rem 1.5rem;
            }
            .logo-icon {
                width: 80px;
                height: 80px;
            }
            .logo-icon i {
                font-size: 42px;
            }
            .logo-area h1 {
                font-size: 1.8rem;
            }
            .option-icon {
                width: 50px;
                height: 50px;
            }
            .option-icon i {
                font-size: 24px;
            }
            .option-info h3 {
                font-size: 1rem;
            }
        }

        /* Cruz médica decorativa */
        .medical-cross {
            position: absolute;
            top: 10%;
            right: 5%;
            width: 80px;
            height: 80px;
            opacity: 0.08;
            animation: rotate 12s linear infinite;
        }

        .medical-cross::before,
        .medical-cross::after {
            content: '';
            position: absolute;
            background: #fff;
        }

        .medical-cross::before {
            width: 100%;
            height: 20%;
            top: 40%;
            left: 0;
        }

        .medical-cross::after {
            width: 20%;
            height: 100%;
            left: 40%;
            top: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Elementos decorativos de fundo -->
    <div class="pharma-bg-icon-1">
        <i class="fas fa-capsules"></i>
    </div>
    <div class="pharma-bg-icon-2">
        <i class="fas fa-syringe"></i>
    </div>
    <div class="pharma-bg-icon-3">
        <i class="fas fa-heartbeat"></i>
    </div>
    <div class="pharma-bg-icon-4">
        <i class="fas fa-band-aid"></i>
    </div>
    <div class="medical-cross"></div>

    <div class="selection-card">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fas fa-hospital-user"></i>
            </div>
            <h1 style="color: white">Farmácia Alegria</h1>
            <p>Sistema de Gestão Farmacêutica</p>
            <div class="badge-pharma">
                <i class="fas fa-shield-alt"></i> Ambiente Seguro
                <i class="fas fa-check-circle" style="margin-left: 5px;"></i>
            </div>
        </div>

        <div class="perfil-options">
            <!-- Opção Cliente -->
            <div class="perfil-option" data-perfil="cliente" onclick="selectPerfil('cliente')">
                <div class="option-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="option-info">
                    <h3>Sou Cliente</h3>
                    <p>Acesse sua conta, faça pedidos, consulte receitas e acompanhe entregas</p>
                </div>
                <div class="option-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>

            <!-- Opção Funcionário -->
            <div class="perfil-option" data-perfil="vendedor" onclick="selectPerfil('vendedor')">
                <div class="option-icon">
                    <i class="fas fa-briefcase"></i>
                </div>
                <div class="option-info">
                    <h3>Sou Funcionário</h3>
                    <p>Ponto de venda, gestão de estoque, atendimento e relatórios</p>
                </div>
                <div class="option-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>

        <button class="btn-proceed" id="proceedBtn" onclick="proceedToLogin()" disabled>
            <i class="fas fa-arrow-right"></i> Continuar
        </button>

        <div class="divider">
            <span>Informações</span>
        </div>

        <div class="footer-links">
            <span class="footer-link" onclick="showHelp()">
                <i class="fas fa-question-circle"></i> Ajuda
            </span>
            <span class="footer-link" onclick="showContact()">
                <i class="fas fa-phone-alt"></i> Contato
            </span>
            <span class="footer-link" onclick="showAbout()">
                <i class="fas fa-info-circle"></i> Sobre
            </span>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAvDc46HzQviKzniF05xH6dMuOtKtsbQYQ",
            authDomain: "sandfarma-b2170.firebaseapp.com",
            databaseURL: "https://sandfarma-b2170-default-rtdb.firebaseio.com",
            projectId: "sandfarma-b2170",
            storageBucket: "sandfarma-b2170.firebasestorage.app",
            messagingSenderId: "27746642641",
            appId: "1:27746642641:web:a0fc437da19b07178e33f0"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let selectedPerfil = null;

        // Função para selecionar perfil
        function selectPerfil(perfil) {
            selectedPerfil = perfil;
            
            // Remover seleção de todos
            document.querySelectorAll('.perfil-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // Adicionar seleção ao clicado
            const selectedOption = document.querySelector(`.perfil-option[data-perfil="${perfil}"]`);
            if (selectedOption) {
                selectedOption.classList.add('selected');
            }
            
            // Habilitar botão
            const proceedBtn = document.getElementById('proceedBtn');
            proceedBtn.disabled = false;
            
            // Mudar texto do botão baseado no perfil
            if (perfil === 'cliente') {
                proceedBtn.innerHTML = '<i class="fas fa-user"></i> Entrar como Cliente';
            } else if (perfil === 'vendedor') {
                proceedBtn.innerHTML = '<i class="fas fa-briefcase"></i> Entrar como Funcionário';
            }
        }

        // Prosseguir para o login correspondente
        function proceedToLogin() {
            if (!selectedPerfil) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Selecione um perfil',
                    text: 'Por favor, selecione como deseja acessar o sistema.',
                    confirmButtonColor: '#2e7d32'
                });
                return;
            }

            // Registrar log de tentativa de acesso
            if (database) {
                database.ref('logs/' + Date.now()).set({
                    acao: 'Seleção de Perfil',
                    detalhes: `Usuário selecionou perfil: ${selectedPerfil}`,
                    data: new Date().toISOString()
                }).catch(e => console.log("Log não registrado:", e));
            }

            // Redirecionar baseado no perfil
            if (selectedPerfil === 'cliente') {
                // Cliente - vai para a página do cliente
                window.location.href = 'cliente.html';
            } else if (selectedPerfil === 'vendedor') {
                // Funcionário - vai para a página de login
                window.location.href = 'login.html';
            }
        }

        // Funções auxiliares
        function showHelp() {
            Swal.fire({
                icon: 'info',
                title: 'Como acessar o sistema?',
                html: `
                    <div style="text-align: left;">
                        <p><strong>👤 Cliente:</strong> Utilize seu e-mail e senha cadastrados. Se ainda não tem conta, crie uma na área do cliente.</p>
                        <p><strong>👔 Funcionário:</strong> Utilize o nome de usuário e senha fornecidos pelo administrador.</p>
                        <hr>
                        <p class="text-muted">Em caso de dúvidas, entre em contato com o suporte.</p>
                    </div>
                `,
                confirmButtonColor: '#2e7d32'
            });
        }

        function showContact() {
            Swal.fire({
                icon: 'info',
                title: 'Contato',
                html: `
                    <div style="text-align: center;">
                        <p><i class="fas fa-phone-alt"></i> <strong>Telefone:</strong> (XX) XXXX-XXXX</p>
                        <p><i class="fas fa-envelope"></i> <strong>E-mail:</strong> contato@farmaciaalegria.com</p>
                        <p><i class="fab fa-whatsapp"></i> <strong>WhatsApp:</strong> (XX) 9XXXX-XXXX</p>
                        <hr>
                        <p><strong>Horário de Atendimento:</strong></p>
                        <p>Segunda a Sexta: 08h às 20h<br>Sábado: 08h às 14h</p>
                    </div>
                `,
                confirmButtonColor: '#2e7d32'
            });
        }

        function showAbout() {
            Swal.fire({
                icon: 'success',
                title: 'Farmácia Alegria Pharma',
                html: `
                    <div style="text-align: center;">
                        <i class="fas fa-capsules" style="font-size: 48px; color: #2e7d32; margin-bottom: 10px;"></i>
                        <p><strong>Versão:</strong> 2.0.0</p>
                        <p><strong>Sistema de Gestão Farmacêutica</strong></p>
                        <p>Desenvolvido para otimizar o atendimento e gestão da farmácia.</p>
                        <hr>
                        <p class="text-muted">© 2024 Farmácia Alegria - Todos os direitos reservados</p>
                    </div>
                `,
                confirmButtonColor: '#2e7d32'
            });
        }

        // Permitir navegação com teclado (setas)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                const options = ['cliente', 'vendedor'];
                let currentIndex = selectedPerfil ? options.indexOf(selectedPerfil) : -1;
                
                if (e.key === 'ArrowDown') {
                    currentIndex = (currentIndex + 1) % options.length;
                } else if (e.key === 'ArrowUp') {
                    currentIndex = (currentIndex - 1 + options.length) % options.length;
                }
                
                if (currentIndex !== -1) {
                    selectPerfil(options[currentIndex]);
                }
            } else if (e.key === 'Enter' && selectedPerfil) {
                proceedToLogin();
            }
        });

        // Verificar se já existe sessão ativa (opcional)
        function checkActiveSession() {
            const userSession = localStorage.getItem('sandgest_user');
            const clientSession = localStorage.getItem('sandgest_cliente');
            
            if (userSession || clientSession) {
                Swal.fire({
                    icon: 'question',
                    title: 'Sessão ativa encontrada',
                    text: 'Você já possui uma sessão ativa. Deseja continuar ou fazer novo login?',
                    showCancelButton: true,
                    confirmButtonText: 'Continuar sessão',
                    cancelButtonText: 'Novo login',
                    confirmButtonColor: '#2e7d32',
                    cancelButtonColor: '#757575'
                }).then((result) => {
                    if (result.isConfirmed) {
                        if (userSession) {
                            const user = JSON.parse(userSession);
                            if (user.tipo === 'admin') {
                                window.location.href = 'dashboard.html';
                            } else {
                                window.location.href = 'func.html';
                            }
                        } else if (clientSession) {
                            window.location.href = 'cliente.html';
                        }
                    } else {
                        localStorage.removeItem('sandgest_user');
                        localStorage.removeItem('sandgest_cliente');
                    }
                });
            }
        }
        
        // Descomente a linha abaixo se quiser verificar sessão ativa ao carregar
        // checkActiveSession();
    </script>
</body>
</html>
